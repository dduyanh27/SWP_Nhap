# ===================================================================
# APPLICATION CORE CONFIGURATIONS
# ===================================================================
spring.application.name=vmfruit

# Kích hoạt profile local để nạp cấu hình DB bảo mật từ file application-local.properties
spring.profiles.include=local

# ===================================================================
# SERVER & VIEW RESOLVER CONFIGURATIONS (FOR JSP)
# ===================================================================
# Main port for the Spring Boot application
server.port=8080

# Cấu hình đường dẫn tìm file giao diện JSP inside src/main/webapp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ===================================================================
# MULTIPART FILE UPLOADS
# Required for uploading Fruit Product images (Admin) and Complaint photos (Customer)
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===================================================================
# JACKSON JSON SERIALIZATION
# Formats standard date-time patterns across the system for accurate TTL/Expiry tracking
# ===================================================================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===================================================================
# MAIL (SMTP) — credentials in application-local.properties
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# APPLICATION BASE URL (for password reset links, etc.)
# ===================================================================
app.base-url=http://localhost:8080
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# LOGGING CONFIGURATIONS
# ===================================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
# Cấu hình log mức DEBUG riêng cho package của nhóm để dễ check lỗi nghiệp vụ
logging.level.com.swp391.se2006.g2.vmfruit=DEBUG

# ===================================================================
# SECURITY & JWT CONFIGURATION PLACEHOLDERS
# Retained for future Screen & Functional Token-based Authorization
# ===================================================================
# HS256 base64 encoded secret key placeholder
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token validity duration (e.g., 86400000 ms = 24 hours)
app.jwt.expiration-ms=86400000

# ===================================================================
# JPA / SQL SERVER (schema created via VMFruitDB.sql)
# ===================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

